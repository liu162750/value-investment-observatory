  totalWeight+=position.weight;

  const quote=stocks.find(s=>s.symbol===position.symbol)?.quote;
  const stamp=Date.parse((quote?.time||'').replace(' ','T')+'+08:00');
  if(typeof quote?.change!=='number'||!Number.isFinite(quote.change)||quote.time?.slice(0,10)!==today||!Number.isFinite(stamp)||stamp>now)return null;

 const stamp=Date.parse(timestamp.replace(' ','T')+'+08:00');if(!Number.isFinite(stamp)||now<stamp||now-stamp>300000)return '';
 const china=new Date(now+8*3600000),day=china.getUTCDay(),minutes=china.getUTCHours()*60+china.getUTCMinutes();
 if(day===0||day===6||!((minutes>=570&&minutes<=690)||(minutes>=780&&minutes<=900)))return '';
 const price=s.quote.price;if(!Number.isFinite(price))return '';
 const hits=(s.levels||[]).flatMap((range,i)=>Array.isArray(range)&&range.length===2&&range.every(Number.isFinite)&&(s.levelReview?.policyId==='weekly-close-atr20-v1'?(i<2?price<=range[1]:price>=range[0]):price>=range[0]&&price<=range[1])?[['买T1','买T2','卖T1','卖T2'][i]]:[]);
 return hits.length?hits.join(' / ')+' · 触价，待确认':'';
}

}

function buyTierStatus(s,k,a,now=Date.now(),stale=false){
 if(k>1)return '';
 const r=s.levelReview,check=s.tradeChecks?.[k],checked=Date.parse(check?.checkedAt||''),quoteTime=Date.parse((s.quote?.time||'').replace(' ','T')+'+08:00');
 const recent=check?.accountId===a?.id&&Number.isFinite(checked)&&now>=checked&&now-checked<=300000;
 const settled=recent&&check.stopConfirmed===true,cap=k===0&&a?.weight>=.85;
 if(r?.status==='pending-support'||r?.recovery?.frozen)return '下跌/破位冻结，不能买';
 if(r?.priceValidation?.length)return '档位待复核，不能买';
 if(cap)return '已达8.5层，T1不能买';
 const today=new Date(now).toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});
 if(!r?.marketGate||r.marketGate.asOf!==today)return '';
 if(r.marketGate.frozen!==false)return '';
 if(k===1&&!settled)return recent&&check.stopConfirmed===false?'未企稳，不能买':'企稳待核验，暂不能买';
 const pos=a?.positions?.find(p=>p.symbol===s.symbol);
 if(!a?.rulesConfirmed||!pos||pos.full||pos.budgetAvailable?.[k]!==true)return (k===1?'企稳已确认；':'T1不要求企稳；')+'仓位额度待核验';
 const local=new Date(now+8*3600000),minute=local.getUTCHours()*60+local.getUTCMinutes(),session=local.getUTCDay()>=1&&local.getUTCDay()<=5&&(minute>=570&&minute<=690||minute>=780&&minute<=900);
 if(stale||!session||!Number.isFinite(quoteTime)||now<quoteTime||now-quoteTime>300000)return (k===1?'企稳已确认；':'T1不要求企稳；')+'等待实时核验';

 if(!recent||check.confirmed!==true)return (k===1?'企稳已确认；':'T1不要求企稳；')+'其他条件待核验';
 return k===1?'企稳及其他条件通过（限T2预算）':'试探条件通过（限T1预算）';
}

 const checkedAt=auditValid?audit.checkedAt:check.checkedAt||review.asOf;
 const dataDate=auditValid?audit.dataDate:check.dataDate||review.dataDate;
 const missing=auditValid?audit.missing:check.recovery?.missing||review.recovery?.missing||[];
 const known=!!review.status,priceInvalid=!!review.priceValidation?.length;
 return {frozen,checkedAt,dataDate,missing,source:auditValid?audit.source:review.source,next:review.nextScheduled,known,priceInvalid,label:frozen?'买档暂停 · 恢复条件未通过':priceInvalid?'价格结构待复核':known?'价格档已复核':'价格复核记录未取得'};
}

function recapDailyMetrics(rows,date,closed){
 const r=(rows||[]).filter(x=>x.date<date||closed&&x.date===date).filter(x=>Number.isFinite(x.close)&&x.close>0).sort((a,b)=>a.date.localeCompare(b.date));

 const ma20=r.length>=20?mean(r.slice(-20),'close'):null,ma60=r.length>=60?mean(r.slice(-60),'close'):null;
 let macd='MACD样本不足';
 if(r.length>=60){let fast=r[0].close,slow=fast,dea=0,prev=null,cur=null;r.forEach(x=>{fast+=2/13*(x.close-fast);slow+=2/27*(x.close-slow);const dif=fast-slow;dea+=2/10*(dif-dea);prev=cur;cur={dif,dea};});macd=prev.dif<=prev.dea&&cur.dif>cur.dea?'当日金叉':prev.dif>=prev.dea&&cur.dif<cur.dea?'当日死叉':cur.dif>cur.dea?'DIF在DEA上方':cur.dif<cur.dea?'DIF在DEA下方':'DIF与DEA相等';}

 const ratio=vmean&&Number.isFinite(last.volume)&&last.volume>=0?last.volume/vmean:null;
 const volume=ratio===null?'量能不足':(ratio>1.15?'放量':ratio<.85?'缩量':'平量')+(r.length<2?'':last.close>r.at(-2).close?'上涨':last.close<r.at(-2).close?'下跌':'平收');

}

 const touched=s=>!quoteOK(s)?[]:(s.levels||[]).flatMap((r,i)=>Array.isArray(r)&&r.length===2&&r.every(Number.isFinite)&&(s.levelReview?.policyId==='weekly-close-atr20-v1'?(i<2?s.quote.price<=r[1]:s.quote.price>=r[0]):s.quote.price>=r[0]&&s.quote.price<=r[1])?[['买T1','买T2','卖T1','卖T2'][i]]:[]);
 const frozen=s=>s.levelReview?.status==='pending-support'||s.levelReview?.recovery?.frozen===true;
 const snapshots=card('03','持仓四股 · 当日快照',(d.stocks||[]).map(s=>{const m=recapDailyMetrics(s.rows,date||'',f.closed),aligned=m.date===date,hits=touched(s);return '<div class="recap-mini-stock"><header><span>'+esc(s.name)+'</span><b class="'+(quoteOK(s)?color(s.quote.change):'')+'">'+(quoteOK(s)?pct(s.quote.change):'行情待齐')+'</b></header><p>'+esc(aligned?m.volume+' · '+m.trend:'当日完整量价数据待齐')+'<br>'+esc(hits.length?hits.join(' / ')+' 已触价，非执行许可':'T1/T2：'+(quoteOK(s)?'无触价信号':'未核验'))+(frozen(s)?' · 买档冻结':'')+'</p></div>';}).join(''));
 const sectorRows=(d.recapSectors?.items||[]).filter(x=>x.date===date&&Number.isFinite(x.change)&&Number.isInteger(x.rank)&&x.rank>0&&x.rank<=x.total);
 const sector=card('04','板块强弱',sectorRows.length?sectorRows.map(x=>'<div class="recap-mini-stock"><header><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.name)+'</a><b class="'+color(x.change)+'">'+pct(x.change)+'</b></header><p>'+esc(x.scope+'内第'+x.rank+' / '+x.total+'名 · '+x.time)+'</p></div>').join('')+'<p class="recap-note">东方财富行情；算力概念≠纯AI指数。概念与行业分别排名，不作跨类别名次比较。</p>':'<div class="recap-empty">AI算力 / 电网设备<br>同日板块涨幅与排名尚未取得</div><p class="recap-note">不以四只持仓涨跌替代板块排名。</p>');

 const events=(d.importantEvents?.events||[]).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&e.date>=date&&!e.actualDate).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
 const news=[...(d.marketNews||[]),...(d.stocks||[]).flatMap(s=>s.notices||[])].filter(n=>(n.date||n.publishedAt||'').slice(0,10)===date&&n.title).filter((n,i,a)=>a.findIndex(x=>x.title===n.title)===i).slice(0,2);
 const list=items=>'<ul class="recap-events">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
 const message=card('05','消息与财报日历',list(events.map(e=>e.date.slice(5)+' '+(e.name||'')+' '+e.title))+'<p class="recap-note">'+(events.length?'预约日程，以公司实际公告为准。':'预约日历未取得。')+'</p><div class="recap-chips">'+chip('当日信息 · 不作涨跌归因')+'</div>'+(news.length?list(news.map(n=>n.title)):'<p class="recap-note">未取得当日关键消息证据，不作催化推断。</p>'));
 const plan=card('06','下一交易日观察',(d.stocks||[]).map(s=>'<div class="recap-mini-stock"><header><span>'+esc(s.name)+'</span><span class="amber">'+(frozen(s)?'买档冻结':'按条件核验')+'</span></header><p>'+esc((s.levels||[]).map((r,i)=>['买T1','买T2','卖T1','卖T2'][i]+' '+(Array.isArray(r)?r.map(x=>num(x)).join('–'):'待复核')).join(' · '))+'</p></div>').join('')+'<details><summary>查看触发与账户条件</summary><p>'+esc(f.context)+' T1须满足账户仓位上限；T2须独立确认企稳与预算。市场闸门、档位有效性及可卖数量均须通过，触价不能代替这些检查；不自动下单。</p></details>');
 return '<div class="recap-heading"><h3>'+esc(f.title)+'</h3><span>'+esc(date||'日期未取得')+(f.stale?' · 备用快照':f.closed?' · 收盘数据':' · 盘中参考')+'</span></div><div class="recap-grid">'+market+emotion+snapshots+sector+message+plan+'</div><div class="recap-source">'+esc(f.source)+'。量能为前20个完整交易日均额比较；MACD(12,26,9)以首个收盘价初始化EMA，至少60根完整日线。缺失或跨日数据不生成当日结论。'+(same?'':' 指标最近日线：'+esc(metric.date||'未取得'))+'</div>';
}
function renderDailyRecap(account){
 const host=document.querySelector('.unified-news');if(!host)return;let box=host.querySelector('.daily-recap');if(!box){box=document.createElement('section');box.className='daily-recap';box.setAttribute('aria-label','市场与持仓复盘');host.prepend(box);}box.innerHTML=dailyRecapHTML(dailyRecapFacts(model,account),model,account);
}

function newerGold(incoming,current){
 if(!current)return incoming;if(!incoming)return current;
 const time=g=>Date.parse((g.quoteTime||'').replace(' ','T')+'+08:00');
 return Number.isFinite(time(current))&&(!Number.isFinite(time(incoming))||time(current)>time(incoming))?current:incoming;
}
function newerQuote(incoming,current){
 if(!current)return incoming;if(!incoming)return current;
 const stamp=q=>Date.parse(q.updatedAt||q.quoteTime||'');
 return Number.isFinite(stamp(current))&&(!Number.isFinite(stamp(incoming))||stamp(current)>stamp(incoming))?current:incoming;
}
function mergeDashboardData(next,previous){
 if(next.stale&&previous?.stocks?.length&&next.cacheRevision===previous.cacheRevision)return {...previous,stale:true,updateError:next.updateError,gold:newerGold(next.gold,previous.gold),bnb:newerQuote(next.bnb,previous.bnb)};
 if(!previous)return next;next.gold=newerGold(next.gold,previous.gold);next.bnb=newerQuote(next.bnb,previous.bnb);
 for(const stock of next.stocks||[]){const old=previous.stocks?.find(s=>s.symbol===stock.symbol);if(!old)continue;
  if(stock.newsError)stock.notices=old.notices||[];if(stock.mediaError)stock.mediaNews=old.mediaNews||[];
 }
 if(next.marketNewsError)next.marketNews=previous.marketNews||[];
 if(!next.importantEvents)next.importantEvents=previous.importantEvents;
 return next;
}
const dashboardCacheKey='dashboard.latest.v1';
function restoreDashboard(seed,storage){
 try{storage=storage||localStorage;const cached=JSON.parse(storage.getItem(dashboardCacheKey));if(seed?.cacheRevision&&cached?.cacheRevision===seed.cacheRevision&&Array.isArray(cached.stocks)&&Date.parse(cached.generated)>Date.parse(seed.generated))return {...cached,stale:true,restored:true};}catch{}
 return seed?{...seed,stale:true}:null;
}
function saveDashboard(data,storage){
 if(!data?.cacheRevision||data.stale||!Array.isArray(data.stocks))return;
 try{storage=storage||localStorage;storage.setItem(dashboardCacheKey,JSON.stringify(data));}catch{}
}
let goldBusy=false;
async function loadGold(){
 if(goldBusy)return;goldBusy=true;
 try{const response=await fetch('/api/gold',{cache:'no-store',signal:AbortSignal.timeout(35000)});if(!response.ok)throw Error();const gold=await response.json();if(!model)return;model.gold=newerGold(gold,model.gold);saveDashboard(model);renderGold();renderHeaderQuotes();}
 catch{if(model?.gold){model.gold={...model.gold,quoteError:true,session:'报价更新失败 · 保留上次来源时间'};renderGold();renderHeaderQuotes();}}
 finally{goldBusy=false;}
}
let volumeBusy=false;
async function refreshMarketVolume(){if(volumeBusy||!model)return;volumeBusy=true;try{const r=await fetch('/api/market-volume',{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const q=await r.json();if(!q.sh||!q.sz)return;model.marketTurnover=q;const node=document.querySelector('.market-volume-inline');if(node)node.outerHTML=marketVolume(model);}catch{}finally{volumeBusy=false;}}
setInterval(()=>{if(!document.hidden)refreshMarketVolume();},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshMarketVolume();});
async function load(){if(busy)return;busy=true;$('#refresh').disabled=true;$('#refresh').textContent='更新中';try{const r=await fetch('/data/dashboard.json',{cache:'no-store',signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error();const next=await r.json();if(!Array.isArray(next.stocks))throw Error();model=mergeDashboardData(next,model);saveDashboard(model);refreshMarketVolume();clearTimeout(load.retryTimer);render();}catch{$('#status').textContent='更新失败 · 保留最近核验数据 '+(model?.date||'');if(!model)$('#cards').innerHTML='<p class="empty">当前数据未取得，正在自动重试。</p>';clearTimeout(load.retryTimer);load.retryTimer=setTimeout(()=>{if(!document.hidden)load();},10000);}finally{busy=false;$('#refresh').disabled=false;$('#refresh').textContent='刷新';}}
$('#refresh').onclick=()=>{loadGold();load();};if(window.initialDashboard){model=window.initialDashboard;render();$('#status').textContent='最近核验数据 '+model.date+' · 检查更新';}loadGold();load();setInterval(()=>{if(!document.hidden)loadGold();},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadGold();load();}});setInterval(()=>{if(!document.hidden)load();},30000);
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_stock_watchlist',description:'读取大盘、隔夜美股和四股T1/T2观察区。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:async()=>{if(!model)await load();return model?{date:model.date,us:model.us,stocks:model.stocks.map(s=>({name:s.name,quote:s.quote,levels:s.levels,distances:s.distances,logic:s.logic}))}:{error:'数据不可用'};}})).catch(()=>{});}catch{}}
</script></body></html>
