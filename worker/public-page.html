<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06070a"><title>价值投资观察台</title>
<style>
:root{color-scheme:dark;--bg:#06070a;--ink:#e8edf5;--muted:#8b95a7;--line:#252c39;--gold:#f0b429;--up:#ff4d4f;--down:#16c784;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(ellipse 45% 30% at 8% 2%,rgba(240,180,41,.13),transparent),radial-gradient(ellipse 48% 30% at 96% 8%,rgba(74,132,255,.1),transparent),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),var(--bg);background-size:auto,auto,24px 24px,24px 24px,auto;min-width:0}button{font:inherit;cursor:pointer}.shell{max-width:1320px;margin:auto;padding:20px 28px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:15px}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--gold);color:#141922;font-weight:800}.brand h1{margin:0;font-size:19px}.meta{font-size:11px;color:var(--muted);margin-top:2px}.refresh{border:1px solid #4c4634;border-radius:999px;background:#191c23;color:#e8edf5;padding:8px 14px}.refresh:hover{border-color:var(--gold)}.section{margin-top:24px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head h2{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:15px;letter-spacing:1px}.section-head h2 b{color:var(--gold);font-size:12px}.section-head h2:after{content:"";display:block;width:24px;height:2px;background:var(--gold)}.sub{color:var(--muted);font-size:11px}.empty{color:var(--muted);font-size:12px;padding:13px 0}.notice-list,.news-list{display:grid;gap:0}.notice,.news{display:grid;grid-template-columns:125px 1fr auto;gap:12px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.notice{border-left:2px solid var(--gold);padding-left:12px}.notice a,.news a{color:var(--ink);text-decoration:none}.notice a:hover,.news a:hover{color:var(--gold)}.stamp,.type{color:var(--muted);font-size:11px}.index-grid,.watch-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.index,.watch{min-width:0;padding:10px 16px;border-right:1px solid var(--line)}.index:first-child,.watch:first-child{padding-left:0}.index:last-child,.watch:last-child{border-right:0}.label{font-size:12px;color:var(--muted)}.value{font-weight:700;font-size:25px;letter-spacing:-.6px;margin-top:5px;white-space:nowrap}.change{font-size:13px;font-weight:650;white-space:nowrap}.up{color:var(--up)}.down{color:var(--down)}.pools,.gate-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}.pill{border-radius:999px;padding:5px 10px;font-size:11px;background:#1e2632;border:1px solid var(--line)}.pill.strong{background:#3c1e22;color:#ff9395}.pill.improving{background:#3a2e19;color:#f0c870}.pill.weak,.pill.pending{background:#1b2730;color:#9cc3e0}.guard{margin:0 -14px;padding:17px 14px;background:linear-gradient(90deg,rgba(240,180,41,.12),rgba(74,132,255,.06));border-top:1px solid #b7954c55;border-bottom:1px solid #b7954c55;display:flex;align-items:center;justify-content:space-between;gap:14px}.guard strong{font-size:21px;color:var(--gold)}.guard p{margin:4px 0 0;color:var(--muted);font-size:12px}.watch .value{font-size:22px}.tier-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tier{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent),#141922;border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--gold);border-radius:3px 18px 14px 14px;padding:15px;min-width:0}.tier-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.tier-top h3{margin:0;font-size:17px}.tier-top .change{font-size:12px}.tier-price{font-size:22px;font-weight:700;letter-spacing:-.6px}.tier-meta{font-size:11px;color:var(--muted);line-height:1.7;margin:7px 0 10px}.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.band{min-width:0;border-left:1px solid var(--line);padding:5px 6px}.band:first-child{border-left:0;padding-left:0}.band b{display:block;font-size:11px}.band strong{display:block;font-size:13px;margin:3px 0;white-space:nowrap}.band small{font-size:10px;color:var(--muted)}.tier-state{font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.tier-source{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px;overflow-wrap:anywhere}.news{grid-template-columns:65px 1fr;position:relative;padding-left:15px;border-left:1px solid #5b6472}.news:before{content:"";position:absolute;left:-4px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--gold)}.foot{color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:24px;padding-top:12px;line-height:1.6}
@media(max-width:760px){.shell{max-width:680px;padding:12px 14px 28px}.brand h1{font-size:16px}.section{margin-top:20px}.section-head h2{font-size:13px}.index-grid,.watch-grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:10px}.index:nth-child(2),.watch:nth-child(2){border-right:0}.index:nth-child(3),.watch:nth-child(3){padding-left:0}.index,.watch{padding:8px 12px}.value{font-size:21px}.tier-grid{grid-template-columns:1fr}.guard{margin-left:-14px;margin-right:-14px}.notice{grid-template-columns:1fr}.notice .type{display:none}}
@media(max-width:390px){.shell{padding-left:12px;padding-right:12px}.guard{margin-left:-12px;margin-right:-12px}.index,.watch{padding-right:7px;padding-left:7px}.index:first-child,.watch:first-child,.index:nth-child(3),.watch:nth-child(3){padding-left:0}.value{font-size:19px}.watch .value{font-size:19px}.bands{gap:0}.band{padding:5px 3px}.band strong{font-size:11px}.tier{padding:12px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="logo">V</span><div><h1>价值投资观察台</h1><div class="meta" id="updated">正在读取数据…</div></div></div><button class="refresh" id="refresh" type="button">刷新</button></header>
<section class="section" id="announcements"><div class="section-head"><h2><b>01</b> 公告</h2><span class="sub">四股近两天公告</span></div><div class="notice-list" id="notice-list"><div class="empty">读取中…</div></div></section>
<section class="section" id="market"><div class="section-head"><h2><b>02</b> A股大盘</h2><span class="sub" id="market-time">日期待核验</span></div><div class="gate-row" id="gate"></div><div class="index-grid" id="indices"></div><div class="pools" id="pools"></div></section>
<section class="section" id="discipline"><div class="section-head"><h2><b>03</b> 仓位纪律</h2></div><div class="guard" id="guard"></div></section>
<section class="section" id="watch"><div class="section-head"><h2><b>04</b> 自选</h2><span class="sub">四只固定观察股</span></div><div class="watch-grid" id="watch-grid"></div></section>
<section class="section" id="tiers"><div class="section-head"><h2><b>05</b> 长线分档</h2><span class="sub">周一 / 周三收盘复核</span></div><div class="tier-grid" id="tier-grid"></div></section>
<section class="section" id="news"><div class="section-head"><h2><b>06</b> 快讯</h2><span class="sub">来源时间以原文为准</span></div><div class="news-list" id="news-list"></div></section>
<footer class="foot">公开版隐藏两位用户的持仓、市值、现金和个人减仓计划。档位为技术观察区，触价与交易许可分别核验；来源失败或历史快照不得当成实时信号。</footer></main>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=(x,d=2)=>Number.isFinite(x)?Number(x).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—',pct=x=>Number.isFinite(x)?(x>0?'+':'')+n(x)+'%':'—',color=x=>x>=0?'up':'down';
function link(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:'#'}catch{return '#'}}
function chinaDay(now=Date.now()){return new Date(now+8*3600000).toISOString().slice(0,10)}
function render(d){
 $('updated').textContent=(d.stale?'历史快照 · ':'')+'更新 '+(d.generated?new Date(d.generated).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'时间待核验');
 const day=chinaDay(),start=new Date(Date.parse(day+'T00:00:00Z')-2*86400000).toISOString().slice(0,10);
 const notices=(d.stocks||[]).flatMap(s=>(s.notices||[]).map(a=>({...a,stock:s.name}))).filter(a=>(a.date||'').slice(0,10)>=start).sort((a,b)=>(b.publishedAt||b.date||'').localeCompare(a.publishedAt||a.date||'')).slice(0,12);
 $('notice-list').innerHTML=notices.length?notices.map(a=>'<div class="notice"><span class="stamp">'+esc(a.publishedAt||a.date||'')+'</span><a href="'+esc(link(a.url))+'" target="_blank" rel="noopener noreferrer">'+esc(a.stock+' · '+a.title)+'</a><span class="type">'+esc(a.source||'公告')+'</span></div>').join(''):'<div class="empty">近两天暂无已取得的四股公告</div>';
 const g=d.marketGate?.weekly||{},state=['strong','improving','weak'].includes(g.status)?g.status:'pending',label={strong:'强势',improving:'转强',weak:'弱势',pending:'待核验'}[state];
 $('market-time').textContent='行情 '+esc(d.date||'待核验')+' · 周线基准 '+esc(g.dataDate||'待核验');
 $('gate').innerHTML='<span class="pill '+state+'">周线 '+label+'</span><span class="sub">完整周收盘 '+n(g.indexClose)+' · MA10 '+n(g.ma10)+' · MA20 '+n(g.ma20)+'</span>';
 $('indices').innerHTML=(d.market||[]).slice(0,4).map((m,i)=>'<div class="index"><div class="label">'+['上证指数','深证成指','创业板指','科创50'][i]+'</div><div class="value">'+n(m.quote?.price??m.rows?.at(-1)?.close)+'</div><div class="change '+color(m.quote?.change)+'">'+pct(m.quote?.change)+'</div></div>').join('');
 $('pools').innerHTML=['涨停','跌停','炸板'].map((name,i)=>'<span class="pill">'+name+' '+esc(d.pools?.[i]?.count??'待核验')+' 家</span>').join('');
 const cap=Number.isFinite(g.maxTotalWeight)?n(g.maxTotalWeight*100,0)+'%':'待核验';
 $('guard').innerHTML='<div><div class="label">本周策略总仓位上限</div><strong>'+cap+'</strong><p>'+(state==='weak'?'周线弱势，两档新增买入暂停':state==='improving'?'周线转强，仅买T1可继续核验':state==='strong'?'周线强势，两档仍需逐项核验':'周线未核验，新增买入暂停')+'</p></div><div class="sub">个人当前仓位及超配进度已隐藏</div>';
 $('watch-grid').innerHTML=(d.stocks||[]).map(s=>'<div class="watch"><div class="label">'+esc(s.name)+'</div><div class="value">¥'+n(s.quote?.price)+'</div><div class="change '+color(s.quote?.change)+'">'+pct(s.quote?.change)+'</div></div>').join('');
 $('tier-grid').innerHTML=(d.stocks||[]).map(s=>{const r=s.levelReview||{},q=s.quote||{},valid=r.policyId==='mon-wed-close-atr20-v1'&&r.status!=='pending'&&Array.isArray(s.levels)&&s.levels.every(v=>Array.isArray(v)&&v.length===2&&v.every(Number.isFinite)),buyAllowed=state==='strong'?'买T1/T2仅进入后续条件核验':state==='improving'?'仅买T1进入后续条件核验，买T2暂停':'两档新增买入暂停',financial=s.fundamentalReview?.status==='screen-warning'?'；财务初筛提示风险，待正式披露复核':'';return '<article class="tier"><div class="tier-top"><h3>'+esc(s.name)+'</h3><span class="change '+color(q.change)+'">'+pct(q.change)+'</span></div><div class="tier-price">¥'+n(q.price)+'</div><div class="tier-meta">基准 '+esc(r.referenceDate||'待核验')+' 收盘 ¥'+n(r.referencePrice)+' · ATR20 '+n(r.atr20)+'<br>下次复核 '+esc(r.nextScheduled||'待核验')+'</div><div class="bands">'+['买T1','买T2','卖T1','卖T2'].map((name,i)=>'<div class="band"><b class="'+(i<2?'down':'up')+'">'+name+'</b><strong>'+(valid?n(s.levels[i][0])+'–'+n(s.levels[i][1]):'待核验')+'</strong><small>技术观察区</small></div>').join('')+'</div><div class="tier-state">'+esc(valid?buyAllowed+financial:'档位数据待核验，暂不放行新增买入')+'</div><div class="tier-source">行情 '+esc(q.time||'时间待核验')+' · 日线 '+esc(r.dataDate||'待核验')+' · <a href="'+esc(link(r.source))+'" target="_blank" rel="noopener noreferrer">数据来源</a></div></article>'}).join('');
 const news=(d.marketNews||[]).filter(x=>x&&x.title).slice(0,15);$('news-list').innerHTML=news.length?news.map(x=>'<div class="news"><span class="stamp">'+esc(x.time||x.date||'')+'</span><a href="'+esc(link(x.url||x.link))+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></div>').join(''):'<div class="empty">快讯来源暂未取得，正在尝试备用源…</div>';
}
function jsonp(url){return new Promise((resolve,reject)=>{const callback='news_'+Math.random().toString(36).slice(2),script=document.createElement('script');let finished=false;const done=(error,value)=>{if(finished)return;finished=true;clearTimeout(timer);script.remove();delete window[callback];error?reject(error):resolve(value)};const timer=setTimeout(()=>done(new Error('快讯超时')),9000);window[callback]=value=>done(null,value);script.onerror=()=>done(new Error('快讯不可用'));script.src=url+'&callback='+callback;document.head.append(script)})}
async function refreshNews(){try{const data=await jsonp('https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2516&k=&num=20&page=1');const rows=data?.result?.data;if(!Array.isArray(rows)||!rows.length)throw new Error('快讯无数据');$('news-list').innerHTML=rows.slice(0,12).map(x=>'<div class="news"><span class="stamp">'+esc(x.ctime?new Date(Number(x.ctime)*1000).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit'}):'时间待核验')+'</span><a href="'+esc(link(x.wapurl||x.url))+'" target="_blank" rel="noopener noreferrer">'+esc(x.title||'')+'</a></div>').join('')}catch{if(!$('news-list').querySelector('.news'))$('news-list').innerHTML='<div class="empty">快讯来源暂未取得，稍后刷新重试。</div>'}}
async function refresh(){const button=$('refresh');button.disabled=true;button.textContent='读取中…';try{const response=await fetch('/api/dashboard',{cache:'no-store',signal:AbortSignal.timeout(45000)});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();render(data);refreshNews()}catch(e){$('updated').textContent='更新失败：'+e.message+'；请稍后重试'}finally{button.disabled=false;button.textContent='刷新'}}
$('refresh').onclick=refresh;refresh();
</script></body></html>
